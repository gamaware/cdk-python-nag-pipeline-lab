[project]
name = "cdk-python-nag-pipeline-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.271.0",
    "cdk-nag==3.0.2",
    "constructs==10.8.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
